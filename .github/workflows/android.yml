name: Android CI

# Poing! Phase 2: the mGBA libretro core imported at a pinned commit,
# built stock and untouched, plus the JNI bridge to it and a bare
# player spike (app.poing) with a Licences screen and a Robolectric
# startup gate. A push to main builds and verifies a debug APK. A
# push of a v* tag additionally builds the SIGNED release APK: the
# keystore is restored from the POING_KEYSTORE_BASE64 secret, the
# release is assembled with it, its signature and version are
# verified, and the APK is uploaded as the poing-apk-release
# artifact. A second job (release, needs: build) then creates the
# GitHub release for the tag and attaches the signed APK to it,
# using the workflow's own GITHUB_TOKEN — the release asset upload
# MUST happen here, inside Actions: uploading from outside (the
# connector credential used for alpha.1) returns 401 on
# uploads.github.com, so alpha.1 shipped with no attached APK and
# its release notes linked the CI artifact instead. The release job
# only runs after the build job has verified the APK, so the
# release is never created from an unverified build.
#
# Core: mGBA at 7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6
# (libretro/mgba HEAD, 2026-09-16, "Libretro: Disable debug
# logging noise"). mGBA has NO ndk-build route upstream (no
# Android.mk): it builds via CMake exactly as libretro's own CI
# does (-DLIBMGBA_ONLY=ON -DBUILD_LIBRETRO=ON, NDK
# android.toolchain.cmake; BINARY_NAME mgba -> mgba_libretro.so).
# The bridge (bridge/jni/) is a separate CMake module linking
# against the prebuilt core .so; both .so files are staged into
# app/src/main/jniLibs/arm64-v8a/ before Gradle assembles the APK.
#
# Order matters: audit checks -> core -> verify core -> bridge ->
# verify bridge -> stage native libs -> unit tests -> APK -> dex
# guard. A red build stops the line: fix it and verify green before
# pushing anything new.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # version.cmake reads git metadata; a shallow checkout
          # would leave it guessing.
          fetch-depth: 0

      - name: Verify in-app licences match NOTICE
        run: |
          set -euo pipefail
          # The Licences screen reads res/raw/notice.txt, which is
          # a verbatim copy of the repo-root NOTICE. If NOTICE
          # changes, the raw copy must change with it.
          diff NOTICE app/src/main/res/raw/notice.txt || {
            echo "NOTICE and app/src/main/res/raw/notice.txt differ — update the raw copy when NOTICE changes."
            exit 1
          }

      - name: Verify audit pins (licence, build route, core options)
        run: |
          set -euo pipefail
          # Licence: the core must be MPL-2.0.
          grep -q "Mozilla Public License Version 2.0" LICENSE || {
            echo "LICENSE is not MPL-2.0"
            exit 1
          }
          # Exhibit B: the MPL-2.0 template text in LICENSE and
          # tools/debian/copyright is expected; an Exhibit B notice
          # attached to any source file is not. (Mariner O1 audit:
          # zero "Exhibit" in src/ or include/.)
          if grep -rI "Exhibit" src/ include/ | grep -q .; then
            echo "Exhibit B notice found in src/ or include/ — stop and report, do not ship past it."
            grep -rI "Exhibit" src/ include/
            exit 1
          fi
          # Build route: mGBA has no ndk-build route upstream.
          # (deps/ is Poing's own vendoring, not upstream — the
          # rcheevos sources there are built by CMake, so an
          # Android.mk under deps/ must not trip this guard.)
          if find . -path ./.git -prune -o -path ./deps -prune -o -name "Android.mk" -print | grep -q .; then
            echo "Android.mk appeared upstream — the build route changed; re-audit before building."
            exit 1
          fi
          # Core options: the 17 mgba_* keys the Phase 2 bridge will
          # need to answer must all be present.
          COUNT=$(grep -o '"mgba_[a-z_0-9]*"' src/platform/libretro/libretro_core_options.h | sort -u | wc -l)
          if [ "$COUNT" -ne 17 ]; then
            echo "expected 17 mgba_* core options, found $COUNT"
            exit 1
          fi
          for key in mgba_use_bios mgba_skip_bios mgba_color_correction mgba_gb_colors mgba_gb_model; do
            grep -q "\"$key\"" src/platform/libretro/libretro_core_options.h || {
              echo "missing core option: $key"
              exit 1
            }
          done
          echo "audit pins OK: MPL-2.0, no ndk-build route, 17 core options"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 27.2.12479018
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build stock core (arm64-v8a only)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          if [ ! -f "$TOOLCHAIN" ]; then
            echo "android.toolchain.cmake missing from NDK 27.2.12479018: $TOOLCHAIN"
            exit 1
          fi
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DLIBMGBA_ONLY=ON \
            -DBUILD_LIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android -j"$(nproc)"
          SO="build-android/mgba_libretro.so"
          if [ ! -f "$SO" ]; then
            echo "core .so missing: $SO"
            find build-android -name "*.so" | head
            exit 1
          fi
          echo "BUILT_SO=$SO" >> "$GITHUB_ENV"

      - name: Verify core
        run: |
          set -euo pipefail
          SO="$BUILT_SO"
          file "$SO"
          file "$SO" | grep -q "ELF 64-bit.*ARM aarch64" || {
            echo "not an ARM64 ELF: $(file "$SO")"
            exit 1
          }
          SIZE=$(stat -c%s "$SO")
          echo "size: $SIZE bytes"
          if [ "$SIZE" -le 102400 ]; then
            echo "core implausibly small: $SIZE bytes"
            exit 1
          fi
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          # The export list goes to a file, not through a pipe:
          # `echo "$EXPORTS" | grep -q` races under pipefail —
          # grep -q exits the moment it finds a symbol, echo
          # then dies on SIGPIPE and the check fails for a
          # symbol that is present (bit run 43330971555).
          "$NM" -D "$SO" > "$RUNNER_TEMP/core-exports.txt"
          for sym in retro_api_version retro_get_system_info retro_get_system_av_info retro_set_environment retro_set_video_refresh retro_set_audio_sample retro_set_audio_sample_batch retro_set_input_poll retro_set_input_state retro_init retro_deinit retro_load_game retro_unload_game retro_run retro_reset retro_serialize_size retro_serialize retro_unserialize retro_get_memory_data retro_get_memory_size retro_load_game_special retro_get_region retro_cheat_set retro_cheat_reset; do
            grep -q " $sym$" "$RUNNER_TEMP/core-exports.txt" || {
              echo "missing export: $sym"
              cat "$RUNNER_TEMP/core-exports.txt"
              exit 1
            }
          done
          echo "core=mgba pin=7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6 size=$SIZE sha256=$(sha256sum "$SO" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build JNI bridge (arm64-v8a only)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S bridge/jni -B build-bridge \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DMGBA_ROOT="$GITHUB_WORKSPACE" \
            -DMGBA_SO="$GITHUB_WORKSPACE/$BUILT_SO" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-bridge -j"$(nproc)"
          BRIDGE="build-bridge/libpoing-bridge.so"
          if [ ! -f "$BRIDGE" ]; then
            echo "bridge .so missing: $BRIDGE"
            find build-bridge -name "*.so" | head
            exit 1
          fi
          echo "BUILT_BRIDGE=$BRIDGE" >> "$GITHUB_ENV"

      - name: Verify bridge
        run: |
          set -euo pipefail
          BRIDGE="$BUILT_BRIDGE"
          file "$BRIDGE"
          file "$BRIDGE" | grep -q "ELF 64-bit.*ARM aarch64" || {
            echo "not an ARM64 ELF: $(file "$BRIDGE")"
            exit 1
          }
          NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          # The export list goes to a file, not through a pipe:
          # `echo "$EXPORTS" | grep -q` races under pipefail —
          # grep -q exits the moment it finds a symbol, echo
          # then dies on SIGPIPE and the check fails for a
          # symbol that is present (bit run 43330971555).
          "$NM" -D "$BRIDGE" > "$RUNNER_TEMP/bridge-exports.txt"
          # Every JNI entry point the Kotlin Bridge object declares.
          for sym in Java_app_poing_Bridge_nativeInit Java_app_poing_Bridge_nativeLoadGame Java_app_poing_Bridge_nativeGetAvInfo Java_app_poing_Bridge_nativeRunFrame Java_app_poing_Bridge_nativeGetFrame Java_app_poing_Bridge_nativeReadAudio Java_app_poing_Bridge_nativeSetAudioDiscard Java_app_poing_Bridge_nativeSetInput Java_app_poing_Bridge_nativeSetOption Java_app_poing_Bridge_nativeSerializeSize Java_app_poing_Bridge_nativeSerialize Java_app_poing_Bridge_nativeUnserialize Java_app_poing_Bridge_nativeSaveRamSize Java_app_poing_Bridge_nativeReadSaveRam Java_app_poing_Bridge_nativeWriteSaveRam Java_app_poing_Bridge_nativeRtcSize Java_app_poing_Bridge_nativeReadRtc Java_app_poing_Bridge_nativeWriteRtc Java_app_poing_Bridge_nativeSetCheat Java_app_poing_Bridge_nativeClearCheats Java_app_poing_Bridge_nativeUnloadGame Java_app_poing_Bridge_nativeDeinit Java_app_poing_Bridge_nativeLastError Java_app_poing_Bridge_nativeRaInit Java_app_poing_Bridge_nativeRaLogin Java_app_poing_Bridge_nativeRaLoginWithToken Java_app_poing_Bridge_nativeRaToken Java_app_poing_Bridge_nativeRaLogout Java_app_poing_Bridge_nativeRaIsLoggedIn Java_app_poing_Bridge_nativeRaLoggedInUsername Java_app_poing_Bridge_nativeRaUserScoreSoftcore Java_app_poing_Bridge_nativeRaLoadGame Java_app_poing_Bridge_nativeRaUnloadGame Java_app_poing_Bridge_nativeRaIsGameLoaded Java_app_poing_Bridge_nativeRaGameTitle Java_app_poing_Bridge_nativeRaDoFrame Java_app_poing_Bridge_nativeRaReset Java_app_poing_Bridge_nativeRaSerializeProgress Java_app_poing_Bridge_nativeRaDeserializeProgress Java_app_poing_Bridge_nativeRaGetAchievements Java_app_poing_Bridge_nativeRaHasLeaderboards Java_app_poing_Bridge_nativeRaGetLeaderboards Java_app_poing_Bridge_nativeRaFetchLeaderboardEntries Java_app_poing_Bridge_nativeRaHasRichPresence Java_app_poing_Bridge_nativeRaGetRichPresence Java_app_poing_Bridge_nativeRaHttpResponse Java_app_poing_Bridge_nativeSetSensorValue Java_app_poing_Bridge_nativePushCameraFrame; do
            grep -q " $sym$" "$RUNNER_TEMP/bridge-exports.txt" || {
              echo "missing JNI export: $sym"
              cat "$RUNNER_TEMP/bridge-exports.txt"
              exit 1
            }
          done
          echo "bridge=$BRIDGE size=$(stat -c%s "$BRIDGE") sha256=$(sha256sum "$BRIDGE" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage native libraries into the APK
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$BUILT_SO" app/src/main/jniLibs/arm64-v8a/libmgba_libretro.so
          cp "$BUILT_BRIDGE" app/src/main/jniLibs/arm64-v8a/libpoing-bridge.so
          ls -l app/src/main/jniLibs/arm64-v8a/

      - name: Run unit tests (incl. Robolectric startup gate)
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Build debug APK (proves the app compiles)
        run: ./gradlew :app:assembleDebug

      - name: Verify no app method exceeds 255 registers (dex guard)
        run: |
          set -euo pipefail
          # HowlingDog v1.3.0: a composable grew past 256 registers,
          # so the $changed parameter sat at v263 and d8 truncated
          # it to v7 in the prologue's 8-bit-field instructions.
          # ART rejected the class at launch (VerifyError) while the
          # JVM (Robolectric) stayed green — CI never saw it. This
          # guard fails the build if any app method crosses the
          # limit again, so the next oversized composable is split
          # before it ships instead of after. It lives here from
          # Phase 1, permanently; never remove it to get a build
          # green.
          DEXDUMP=$(ls "$ANDROID_HOME/build-tools/"*/dexdump | sort -V | tail -1)
          export DEXDUMP
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexcheck
          python3 - <<'PYEOF'
          import glob, re, subprocess, sys
          import os
          dexdump = os.environ['DEXDUMP']
          worst = []
          for dex in sorted(glob.glob('/tmp/dexcheck/classes*.dex')):
              out = subprocess.run([dexdump, '-d', dex], capture_output=True,
                                   text=True, errors='replace').stdout
              cls = name = typ = None
              for ln in out.splitlines():
                  m = re.match(r"\s*Class descriptor\s*: '(.*);'", ln)
                  if m:
                      cls = m.group(1); continue
                  m = re.match(r"\s*name\s*: '(.*)'", ln)
                  if m:
                      name = m.group(1); continue
                  m = re.match(r"\s*type\s*: '(.*)'", ln)
                  if m:
                      typ = m.group(1); continue
                  m = re.match(r"\s*registers\s*: (\d+)", ln)
                  if m and cls and cls.startswith('Lapp/poing/'):
                      worst.append((int(m.group(1)), cls, name, typ))
          worst.sort(reverse=True)
          print('largest app methods by register count:')
          for n, c, nm, t in worst[:8]:
              print(f'  {n} {c} {nm}{t}')
          bad = [w for w in worst if w[0] > 255]
          if bad:
              print('FAIL: methods over the 255-register limit:')
              for n, c, nm, t in bad:
                  print(f'  {n} {c} {nm}{t}')
              sys.exit(1)
          print('dex register guard OK')
          PYEOF

      - name: Restore release keystore (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # The keystore itself is never in the repo: it arrives
          # base64-encoded in the POING_KEYSTORE_BASE64 secret and
          # is written to the runner's temp dir, which is wiped
          # with the runner. The signing config reads it through
          # POING_KEYSTORE_PATH (see app/build.gradle.kts).
          echo "$POING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/poing-release.keystore"
          echo "POING_KEYSTORE_PATH=$RUNNER_TEMP/poing-release.keystore" >> "$GITHUB_ENV"
        env:
          POING_KEYSTORE_BASE64: ${{ secrets.POING_KEYSTORE_BASE64 }}

      - name: Build signed release APK (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleRelease
        env:
          POING_KEYSTORE_PASSWORD: ${{ secrets.POING_KEYSTORE_PASSWORD }}
          POING_KEY_ALIAS: ${{ secrets.POING_KEY_ALIAS }}
          POING_KEY_PASSWORD: ${{ secrets.POING_KEY_PASSWORD }}

      - name: Verify release APK signature and version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "release APK: $APK ($(stat -c%s "$APK") bytes)"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # The tag and the version must agree: the versionName in
          # build.gradle.kts must equal the tag minus its leading
          # 'v', and the versionCode must be above the debug builds
          # (code 1). The signed alpha needs an uninstall first, by
          # design — it is a new key, so it cannot install over a
          # debug build.
          AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK" | head -1)
          echo "$BADGING"
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG_NAME="${GITHUB_REF#refs/tags/v}"
          [ "$VERSION_NAME" = "$TAG_NAME" ] || {
            echo "tag $TAG_NAME != versionName $VERSION_NAME"
            exit 1
          }
          [ "$VERSION_CODE" -gt 1 ] || {
            echo "versionCode must be above the debug builds (1): $VERSION_CODE"
            exit 1
          }
          echo "$BADGING" | grep -q "name='app.poing' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" || {
            echo "release APK is not $VERSION_NAME / versionCode $VERSION_CODE: $BADGING"
            exit 1
          }
          echo "release APK verified: signed, app.poing $VERSION_NAME/code $VERSION_CODE"

      - name: Upload release APK artifact (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: poing-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgba-libretro-android
          path: ${{ env.BUILT_SO }}
          if-no-files-found: error

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: poing-bridge-android
          path: ${{ env.BUILT_BRIDGE }}
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poing-apk-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Attach signed APK to release
    # Tags only, and only after the build job has verified the
    # signed APK (signature + version). The release is therefore
    # never created from an unverified build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The workflow-level permissions are contents: read; this job
    # needs write to create the release and upload the asset.
    permissions:
      contents: write
    steps:
      - name: Check out source (for the release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: poing-apk-release
          path: release-apk

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          APK_SRC=$(ls release-apk/*.apk)
          [ "$(ls release-apk/*.apk | wc -l)" -eq 1 ] || {
            echo "expected exactly one APK in release-apk/, found:"
            ls -l release-apk/
            exit 1
          }
          [ -s "$APK_SRC" ] || {
            echo "release APK is empty: $APK_SRC"
            exit 1
          }
          # A descriptive asset name: the raw Gradle output is
          # app-release.apk. Same bytes, so the SHA-256 is unchanged.
          APK="poing-$TAG.apk"
          cp "$APK_SRC" "$APK"
          echo "attaching $APK ($(stat -c%s "$APK") bytes, sha256 $(sha256sum "$APK" | cut -d' ' -f1)) to release $TAG"
          # A re-run of the tag workflow (or a release created by
          # hand) must not fail here: create only when missing,
          # then upload with --clobber so a stale asset is replaced
          # rather than erroring.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading the asset only"
          else
            gh release create "$TAG" --title "Poing! $TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "release $TAG now carries:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
